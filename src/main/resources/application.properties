spring.application.name=lakshmi-email-test

server.port=${PORT:8080}

logging.level.com.email.test=INFO

# Brevo Email API
brevo.api-url=https://api.brevo.com/v3/smtp/email
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=${BREVO_SENDER_NAME:Lakshmi Digital Studios}

# Test access protection
email.test.token=${EMAIL_TEST_TOKEN}